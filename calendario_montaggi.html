kground:#dbeafe;border-color:#93c5fd}.nuova-settimana .aggiungi:after{content:none!important}.scheda .apri-scheda:hover strong{text-decoration:underline}.apri-scheda:focus-visible,summary:focus-visible{outline:2px solid #2563eb;outline-offset:3px}.nuova-settimana .scheda details:not(.azioni-scheda){display:block!important;font-size:11px}.compatta .nuova-settimana .scheda{padding:7px 9px!important}.compatta .nuova-settimana .scheda strong{font-size:13px!important}

<body>
<header>
  <h1>🔧 Calendario Montaggi</h1>
  <div class="top-actions">
    <button class="primary" onclick="nuovoMontaggio()">+ Nuovo montaggio</button>
    <button onclick="window.print()">Stampa</button>
  </div>
</header>
<div class="wrap">
  <div class="toolbar">
    <div class="field"><label>Cerca cliente / commessa / città</label><input id="cerca" oninput="render()" placeholder="Es. Rossi, OVI, Bologna"></div>
    <div class="field"><label>Stato</label><select id="filtroStato" onchange="render()"><option value="">Tutti</option><option>Programmato</option><option>In attesa di conferma</option><option>In attesa di materiale</option><option>Completato</option></select></div>
    <div class="field"><label>Squadra</label><select id="filtroSquadra" onchange="render()"><option value="">Tutte</option><option>Squadra 1</option><option>Squadra 2</option></select></div>
    <div class="field"><label>Mese</label><input id="mesePicker" type="month" onchange="vaiMese(this.value)"></div>
    <div class="field"><label>Vista</label><select id="vista" onchange="render()"><option value="settimana">Settimana · giorni e squadre</option><option value="tabella">Tabella mensile</option><option value="cal">Calendario</option><option value="lista">Lista</option></select></div>
    <div class="legend"><span><i class="dot programmato"></i>Programmato</span><span><i class="dot inattesadiconferma"></i>In attesa di conferma</span><span><i class="dot inattesadimateriale"></i>In attesa di materiale</span><span><i class="dot completato"></i>Completato</span></div>
  </div>

  <div id="formPanel" class="panel hidden">
    <h2 id="formTitle">Nuovo montaggio</h2>
    <div class="form-grid">
      <div class="field"><label>Cliente *</label><input id="cliente"></div>
      <div class="field"><label>Commessa / Ordine</label><input id="commessa" placeholder="es. OVI26-..."></div>
      <div class="field"><label>Data inizio montaggio *</label><input id="data" type="date"></div>
      <div class="field"><label for="dataFine">Data fine montaggio</label><input id="dataFine" type="date"><div class="small">Lascia vuota per un solo giorno. Il periodo comprende tutti i giorni, inclusi sabato e domenica.</div></div>
      <div class="field"><label>Ora</label><input id="ora" type="time"></div>
      <div class="field half"><label>Indirizzo cantiere</label><input id="indirizzo"></div>
      <div class="field"><label>Città</label><input id="citta"></div>
      <div class="field"><label>Provincia</label><input id="prov"></div>
      <div class="field"><label>Referente cliente</label><input id="referente"></div>
      <div class="field"><label>Telefono</label><input id="telefono"></div>
      <div class="field"><label>Squadra</label><select id="squadra"><option value="">Da assegnare</option><option>Squadra 1</option><option>Squadra 2</option></select></div>
      <div class="field half"><label>Operatori del montaggio · seleziona uno o più nomi</label><input id="operatori" type="hidden"><div id="operatoriScelta" class="operatori-scelta"></div></div>
      <div class="field"><label>Mezzo</label><input id="mezzo" placeholder="es. Furgone / 7,5 m"></div>
      <div class="field"><label>Stato</label><select id="stato"><option>Programmato</option><option>In attesa di conferma</option><option>In attesa di materiale</option><option>Completato</option></select></div>
      <div class="field half"><label for="inviatoStockSystem" style="display:flex;align-items:center;gap:9px;font-size:14px;color:#123454"><input id="inviatoStockSystem" type="checkbox" style="width:18px;height:18px">Ordine inviato a StockSystem</label><div class="small">Conferma manuale dell’invio dell’ordine al magazzino.</div></div>
      <div class="field full"><label for="attrezzature">Attrezzature previste</label><input id="attrezzature" type="hidden"><div id="attrezzatureScelta" class="operatori-scelta"></div><label for="altreAttrezzature" style="margin-top:8px">Altre attrezzature / quantità e indicazioni</label><input id="altreAttrezzature" placeholder="Es. 2 scale, avvitatori, carrello…" oninput="aggiornaAttrezzature()"></div>
      <div class="field full"><label>Note</label><textarea id="note" placeholder="Materiale da portare, criticità, DPI, accessi, orari..."></textarea></div>
      <div class="field full">
        <label>Allegati PDF dal desktop</label>
        <input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple onchange="aggiungiPDF(event)">
        <div id="docList" style="margin-top:8px"></div>
      </div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="primary" id="saveBtn" onclick="salvaMontaggio()">Salva</button>
      <button onclick="chiudiForm()">Annulla</button>
      <button id="deleteBtn" class="danger hidden" onclick="eliminaMontaggio()">Elimina</button>
    </div>
  </div>

  <div id="calendarPanel" class="calendar">
    <div class="monthbar"><button id="prevPeriod" onclick="cambiaPeriodo(-1)">◀ Precedente</button><h2 id="titoloMese"></h2><button id="nextPeriod" onclick="cambiaPeriodo(1)">Successivo ▶</button></div>
    <label class="compact-control"><input id="compatto" type="checkbox" checked onchange="render()"> Vista compatta <span class="small">· Apri una scheda per vedere tutti i dettagli</span></label>
    <div class="grid compatta" id="calGrid"></div>
  </div>
  <div id="listPanel" class="panel hidden"><h2>Elenco montaggi</h2><div id="lista" class="list"></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBNgpYA2d7HToJppcZ6yLDLSt3A75c9Ogk",
  authDomain: "calendario-spedizioni.firebaseapp.com",
  projectId: "calendario-spedizioni",
  storageBucket: "calendario-spedizioni.firebasestorage.app",
  messagingSenderId: "214380369240",
  appId: "1:214380369240:web:85551d1aa272d9f736412d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const col = collection(db, "montaggi");

let montaggi=[];
let editId=null;
let corrente=new Date(); corrente.setDate(1);
let tempDocs=[];
let saving=false;
let settimana=new Date();
const assegnazioni=new Set();
const campi=['cliente','commessa','data','ora','indirizzo','citta','prov','referente','telefono','squadra','mezzo','stato','note','operatori','attrezzature','dataFine'];

onSnapshot(query(col, orderBy('data', 'asc')), snap=>{
  montaggi=snap.docs.map(d=>{const m={...d.data(),id:d.id};if(m.squadra&&!['Squadra 1','Squadra 2'].includes(m.squadra)){m.operatori=[m.operatori,m.squadra].filter(Boolean).join(', ');m.squadra='';}return m;});
  montaggi.forEach(m=>{assicuraOpzione(document.getElementById('filtroStato'),m.stato);});
  render();
}, err=>{
  alert('Errore Firebase: '+err.message);
  console.error(err);
});

const elencoOperatori=['Ciullo','Amadi','Belaid','Simoni','Puglisi','Aprea','Samir'];
function normalizzaOperatori(value){return [...new Set(String(value||'').split(/[,/;]+/).map(x=>x.trim()).filter(Boolean).map(x=>{if(/^(apr[èe]|prea)$/i.test(x))return 'Aprea';if(/^hamadi$/i.test(x))return 'Amadi';if(/^belaidi$/i.test(x))return 'Belaid';return elencoOperatori.find(n=>n.toLocaleLowerCase()===x.toLocaleLowerCase())||x;}))];}
function renderOperatori(){renderAttrezzature();const selezionati=normalizzaOperatori(document.getElementById('operatori').value);const nomi=[...elencoOperatori,...selezionati.filter(n=>!elencoOperatori.includes(n))];document.getElementById('operatoriScelta').innerHTML=nomi.map((n,i)=>`<label class="operatore"><input type="checkbox" name="operatoreScelto" value="${escapeHtml(n)}" ${selezionati.includes(n)?'checked':''} onchange="aggiornaOperatori()">${escapeHtml(n)}${elencoOperatori.includes(n)?'':' (precedente)'}</label>`).join('');document.getElementById('operatori').value=selezionati.join(', ');}
const attrezzatureBase=['Scale','Trabattello','Imbracatura per lavori in quota','DPI'];
function renderAttrezzature(){const raw=document.getElementById('attrezzature').value;const voci=raw.split('\n').map(x=>x.trim()).filter(Boolean);document.getElementById('attrezzatureScelta').innerHTML=attrezzatureBase.map(n=>`<label class="operatore"><input type="checkbox" name="attrezzaturaScelta" value="${escapeHtml(n)}" ${voci.includes(n)?'checked':''} onchange="aggiornaAttrezzature()">${escapeHtml(n)}</label>`).join('');document.getElementById('altreAttrezzature').value=voci.filter(n=>!attrezzatureBase.includes(n)).join('; ');}
function aggiornaAttrezzature(){const voci=Array.from(document.querySelectorAll('input[name="attrezzaturaScelta"]:checked')).map(x=>x.value);const extra=document.getElementById('altreAttrezzature').value.trim();if(extra)voci.push(extra);document.getElementById('attrezzature').value=voci.join('\n');}
window.aggiornaAttrezzature=aggiornaAttrezzature;
function aggiornaOperatori(){document.getElementById('operatori').value=Array.from(document.querySelectorAll('input[name="operatoreScelto"]:checked')).map(x=>x.value).join(', ');}
window.aggiornaOperatori=aggiornaOperatori;
function assicuraOpzione(el,value){if(value && !Array.from(el.options).some(o=>o.value===value)){el.add(new Option(value,value));}}
function dataLocale(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function statoClass(s){return (s||'Da fare').toLowerCase().replaceAll(' ','').replace('dafare','dafare')}
function nuovoMontaggio(){editId=null; tempDocs=[]; document.getElementById('inviatoStockSystem').checked=false; campi.forEach(id=>document.getElementById(id).value=''); document.getElementById('stato').value='In attesa di conferma'; document.getElementById('data').value=dataLocale(new Date()); renderOperatori(); document.getElementById('formTitle').textContent='Nuovo montaggio'; document.getElementById('deleteBtn').classList.add('hidden'); renderDocs(); document.getElementById('formPanel').classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'});}
function apriMontaggio(id){const m=montaggi.find(x=>x.id===id); if(!m)return; editId=id; document.getElementById('inviatoStockSystem').checked=m.inviatoStockSystem===true; tempDocs=[...(m.docs||[])]; campi.forEach(k=>{const el=document.getElementById(k); if(el.tagName==='SELECT'&&k!=='squadra')assicuraOpzione(el,m[k]); el.value=k==='squadra'&&!['Squadra 1','Squadra 2'].includes(m[k])?'':(m[k]||'');}); if(m.squadra&&!['Squadra 1','Squadra 2'].includes(m.squadra))document.getElementById('operatori').value=[m.operatori,m.squadra].filter(Boolean).join(', ');renderOperatori(); document.getElementById('formTitle').textContent='Modifica montaggio'; document.getElementById('deleteBtn').classList.remove('hidden'); renderDocs(); document.getElementById('formPanel').classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'});}
function chiudiForm(){document.getElementById('formPanel').classList.add('hidden'); editId=null; tempDocs=[]; document.getElementById('inviatoStockSystem').checked=false; document.getElementById('pdfInput').value='';}
async function salvaMontaggio(){if(saving)return; let m={}; campi.forEach(k=>m[k]=document.getElementById(k).value.trim()); m.inviatoStockSystem=document.getElementById('inviatoStockSystem').checked; if(!m.cliente||!m.data){alert('Cliente e data montaggio sono obbligatori.');return;} if(m.dataFine&&m.dataFine<m.data){alert('La data fine non può precedere la data inizio.');return;} if(!m.stato){alert('Seleziona lo stato del montaggio.');return;} saving=true; document.getElementById('saveBtn').disabled=true; try{ m.docs=tempDocs; m.updatedAt=new Date().toISOString(); if(editId){await updateDoc(doc(db,'montaggi',editId),m);}else{m.createdAt=new Date().toISOString(); await addDoc(col,m);} chiudiForm();}catch(err){console.error(err);alert('Salvataggio non riuscito. I dati inseriti restano nel modulo. '+err.message);}finally{saving=false;document.getElementById('saveBtn').disabled=false;}}
async function eliminaMontaggio(){if(!editId)return; if(confirm('Eliminare questo montaggio?')){await deleteDoc(doc(db,'montaggi',editId)); chiudiForm();}}
function filtra(){const q=document.getElementById('cerca').value.toLowerCase(); const fs=document.getElementById('filtroStato').value; const sq=document.getElementById('filtroSquadra').value.toLowerCase(); return montaggi.filter(m=>{const testo=[m.cliente,m.commessa,m.citta,m.indirizzo,m.referente,m.note,m.operatori,m.squadra].join(' ').toLowerCase(); return (!q||testo.includes(q)) && (!fs||m.stato===fs) && (!sq||(m.squadra||'').toLowerCase()===sq);});}
function render(){document.getElementById('calGrid').classList.toggle('compatta',document.getElementById('compatto').checked);document.getElementById('mesePicker').value=dataLocale(corrente).slice(0,7); const vista=document.getElementById('vista').value; document.getElementById('calendarPanel').classList.toggle('hidden',vista==='lista'); document.getElementById('listPanel').classList.toggle('hidden',vista!=='lista'); document.getElementById('prevPeriod').textContent=vista==='settimana'?'◀ Settimana precedente':'◀ Mese precedente';document.getElementById('nextPeriod').textContent=vista==='settimana'?'Settimana successiva ▶':'Mese successivo ▶';if(vista==='settimana')renderSettimana();else if(vista==='tabella')renderTabella();else renderCalendario(); renderLista();}
function nuovaCella(data,squadra){nuovoMontaggio();document.getElementById('data').value=data;document.getElementById('squadra').value=squadra;}
function montaggioNelGiorno(m,iso){return !!m.data&&iso>=m.data&&iso>=''&&iso<=(m.dataFine&&m.dataFine>=m.data?m.dataFine:m.data);}
function periodoMontaggio(m){return m.dataFine&&m.dataFine>m.data?'Dal '+formatData(m.data)+' al '+formatData(m.dataFine):formatData(m.data);}
function indicatoreStock(m){return m.inviatoStockSystem===true?'<span class="stock-inviato">✓ Inviato a StockSystem</span>':'';}
function scheda(m){const sc=statoClass(m.stato),assegnata=['Squadra 1','Squadra 2'].includes(m.squadra);return `<article class="event ${sc} scheda"><button class="apri-scheda" onclick="apriMontaggio('${escapeHtml(m.id)}')"><strong>${escapeHtml(m.ora||'')} ${escapeHtml(m.cliente)}</strong><span>${escapeHtml(m.commessa||'')} · ${escapeHtml(m.citta||'')}</span><br><span class="tag ${sc}">${escapeHtml(m.stato||'Da fare')}</span>${m.docs?.length?' 📎':''}${indicatoreStock(m)}${m.dataFine&&m.dataFine>m.data?`<span class="small" style="display:block">${escapeHtml(periodoMontaggio(m))}</span>`:''}</button><details class="azioni-scheda"><summary>Cambia squadra</summary><label class="assegna-label">Assegna squadra<select aria-label="Assegna squadra a ${escapeHtml(m.cliente)}" onchange="assegnaSquadra('${escapeHtml(m.id)}',this.value,this)"><option value="">Da assegnare</option><option ${m.squadra==='Squadra 1'?'selected':''}>Squadra 1</option><option ${m.squadra==='Squadra 2'?'selected':''}>Squadra 2</option></select></label></details>${m.operatori||(!assegnata&&m.squadra)?`<details><summary>Nominativi</summary>${escapeHtml(m.operatori||m.squadra)}</details>`:'<div class="small">Nominativi da compilare nella scheda</div>'}</article>`;}
async function assegnaSquadra(id,squadra,select){if(assegnazioni.has(id))return;const m=montaggi.find(x=>x.id===id);if(!m)return;const precedente=m.squadra||'';if(editId===id){alert('Questo montaggio è aperto nel modulo. Assegna la squadra dal modulo e premi Salva.');select.value=['Squadra 1','Squadra 2'].includes(precedente)?precedente:'';return;}assegnazioni.add(id);select.disabled=true;try{const dati={squadra,updatedAt:new Date().toISOString()};if(precedente&&!['Squadra 1','Squadra 2'].includes(precedente)&&!m.operatori)dati.operatori=precedente;await updateDoc(doc(db,'montaggi',id),dati);Object.assign(m,dati);render();}catch(e){select.value=['Squadra 1','Squadra 2'].includes(precedente)?precedente:'';alert('Assegnazione non riuscita: '+e.message);}finally{assegnazioni.delete(id);select.disabled=false;}}
function cambiaPeriodo(n){if(document.getElementById('vista').value==='settimana'){settimana.setDate(settimana.getDate()+n*7);corrente=new Date(settimana.getFullYear(),settimana.getMonth(),1);render();}else cambiaMese(n);}
function renderSettimana(){
const start=new Date(settimana);start.setDate(start.getDate()-(start.getDay()+6)%7);
const giorni=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d});
document.getElementById('titoloMese').textContent=giorni[0].toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' – '+giorni[6].toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
const grid=document.getElementById('calGrid');grid.classList.add('tabella');const dati=filtra();const oggi=dataLocale(new Date());
let html='<table class="planning settimana giorni-alto"><thead><tr><th>Squadra</th>';
for(const d of giorni){html+=`<th class="${dataLocale(d)===oggi?'giorno-oggi':''} ${d.getDay()===0||d.getDay()===6?'weekend-head':''}"><span class="giorno-nome">${escapeHtml(d.toLocaleDateString('it-IT',{weekday:'short'}))}</span> <span class="giorno-numero">${d.getDate()}</span>${dataLocale(d)===oggi?'<span class="oggi-label">OGGI</span>':''}</th>`;}
html+='</tr></thead><tbody>';
for(const sq of ['Squadra 1','Squadra 2','']){html+=`<tr><th>${sq||'Da assegnare'}</th>`;
for(const d of giorni){const iso=dataLocale(d);const eventi=dati.filter(m=>montaggioNelGiorno(m,iso)&&(sq?m.squadra===sq:!['Squadra 1','Squadra 2'].includes(m.squadra))).sort((a,b)=>(a.ora||'').localeCompare(b.ora||''));html+=`<td class="${d.getDay()===0||d.getDay()===6?'weekend':''} ${iso===oggi?'col-oggi':''}">`+eventi.map(scheda).join('')+`<button class="aggiungi" title="Aggiungi montaggio" aria-label="Aggiungi montaggio ${iso} ${sq||'da assegnare'}" onclick="nuovaCella('${iso}','${sq}')">+ Montaggio</button></td>`;}html+='</tr>';}
grid.innerHTML=html+'</tbody></table>';
}
window.assegnaSquadra=assegnaSquadra;window.cambiaPeriodo=cambiaPeriodo;
function renderTabella(){
document.getElementById('titoloMese').textContent=corrente.toLocaleDateString('it-IT',{month:'long',year:'numeric'});
const grid=document.getElementById('calGrid');grid.classList.add('tabella');const dati=filtra(),oggi=dataLocale(new Date());
const primo=new Date(corrente.getFullYear(),corrente.getMonth(),1);const start=new Date(primo);start.setDate(1-(primo.getDay()+6)%7);
const ultimo=new Date(corrente.getFullYear(),corrente.getMonth()+1,0);let html='';
for(let w=0;w<6;w++){const inizio=new Date(start);inizio.setDate(start.getDate()+w*7);if(inizio>ultimo)break;
const giorni=Array.from({length:7},(_,i)=>{const d=new Date(inizio);d.setDate(inizio.getDate()+i);return d});
html+='<table class="planning settimana giorni-alto mese-settimana"><thead><tr><th>Squadra</th>';
for(const d of giorni){const fuori=d.getMonth()!==corrente.getMonth();if(fuori){html+='<th class="fuori-mese" aria-label="Fuori dal mese selezionato"></th>';continue;}html+=`<th class="${dataLocale(d)===oggi?'giorno-oggi':''} ${fuori?'fuori-mese':''}"><span class="giorno-nome">${escapeHtml(d.toLocaleDateString('it-IT',{weekday:'short'}))}</span> <span class="giorno-numero">${d.getDate()}</span></th>`;}
html+='</tr></thead><tbody>';
for(const sq of ['Squadra 1','Squadra 2','']){html+=`<tr><th>${sq||'Da assegnare'}</th>`;
for(const d of giorni){const iso=dataLocale(d),fuori=d.getMonth()!==corrente.getMonth();const eventi=fuori?[]:dati.filter(m=>montaggioNelGiorno(m,iso)&&(sq?m.squadra===sq:!['Squadra 1','Squadra 2'].includes(m.squadra))).sort((a,b)=>(a.ora||'').localeCompare(b.ora||''));html+=`<td class="${fuori?'fuori-mese':d.getDay()===0||d.getDay()===6?'weekend':''} ${iso===oggi?'col-oggi':''}">`+eventi.map(scheda).join('')+(fuori?'':`<button class="aggiungi" aria-label="Aggiungi montaggio ${iso} ${sq||'da assegnare'}" onclick="nuovaCella('${iso}','${sq}')">+ Montaggio</button>` )+'</td>';}
html+='</tr>';}
html+='</tbody></table>';}
grid.innerHTML=html;
}
window.nuovaCella=nuovaCella;
function renderCalendario(){const mesi=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre']; document.getElementById('titoloMese').textContent=mesi[corrente.getMonth()]+' '+corrente.getFullYear(); const grid=document.getElementById('calGrid'); grid.classList.remove('tabella'); grid.innerHTML=''; ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].forEach(d=>grid.innerHTML+=`<div class="dayname">${d}</div>`); let first=new Date(corrente); let start=new Date(first); let day=(first.getDay()+6)%7; start.setDate(first.getDate()-day); const dati=filtra(); const today=dataLocale(new Date()); for(let i=0;i<42;i++){let d=new Date(start); d.setDate(start.getDate()+i); let iso=dataLocale(d); let cls='day'; if(d.getMonth()!==corrente.getMonth())cls+=' other'; if(iso===today)cls+=' today'; let html=`<div class="${cls}"><div class="num">${d.getDate()}</div>`; dati.filter(m=>montaggioNelGiorno(m,iso)).sort((a,b)=>(a.ora||'').localeCompare(b.ora||'')).forEach(m=>{let sc=statoClass(m.stato); let clip=(m.docs&&m.docs.length)?' 📎':''; html+=`<div class="event ${sc}" onclick="apriMontaggio('${m.id}')"><strong>${m.ora?m.ora+' - ':''}${escapeHtml(m.cliente)}${clip}</strong><span>${escapeHtml(m.citta||'')}</span><br><span class="small">${escapeHtml(m.commessa||'')}</span><br><span class="small">${escapeHtml(m.squadra||'Da assegnare')}${m.operatori?' — '+escapeHtml(m.operatori):''}</span><br><span class="tag ${sc}">${escapeHtml(m.stato||'Da fare')}</span>${indicatoreStock(m)}</div>`;}); html+='</div>'; grid.innerHTML+=html;}}
function renderLista(){const el=document.getElementById('lista'); const dati=filtra().sort((a,b)=>((a.data||'')+(a.ora||'')).localeCompare((b.data||'')+(b.ora||''))); if(!dati.length){el.innerHTML='<p class="small">Nessun montaggio trovato.</p>';return;} el.innerHTML=dati.map(m=>{let sc=statoClass(m.stato); let docs=m.docs&&m.docs.length?`<div class="small">📎 ${m.docs.length} allegati</div>`:''; return `<div class="row"><div><strong>${escapeHtml(m.cliente)}</strong><div class="small">${escapeHtml(m.commessa||'')}</div></div><div>${periodoMontaggio(m)} ${m.ora||''}</div><div>${escapeHtml([m.citta,m.prov].filter(Boolean).join(' '))}<div class="small">${escapeHtml(m.indirizzo||'')}</div></div><div>${escapeHtml(m.squadra||'')}<div class="small">${escapeHtml(m.operatori||'')}</div>${docs}</div><div><span class="tag ${sc}">${escapeHtml(m.stato||'Da fare')}</span>${indicatoreStock(m)}<br><button onclick="apriMontaggio('${m.id}')" style="margin-top:6px">Apri</button></div></div>`}).join('');}
function cambiaMese(n){corrente.setMonth(corrente.getMonth()+n); render();}
function vaiMese(v){if(!v)return; const [anno,mese]=v.split('-').map(Number); corrente=new Date(anno,mese-1,1); settimana=new Date(corrente);render();}
function formatData(s){if(!s)return''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`;}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function aggiungiPDF(e){for(const f of e.target.files){if(f.type!=='application/pdf' && !f.name.toLowerCase().endsWith('.pdf')){alert('Puoi allegare solo PDF.');continue;} if(f.size>900000){if(!confirm(`Il file ${f.name} è grande (${Math.round(f.size/1024)} KB). Vuoi allegarlo comunque?`)) continue;} const dataUrl=await fileToDataURL(f); tempDocs.push({name:f.name,data:dataUrl,size:f.size,ts:Date.now()});} e.target.value=''; renderDocs();}
function fileToDataURL(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function renderDocs(){const el=document.getElementById('docList'); if(!tempDocs.length){el.innerHTML='<div class="empty">Nessun PDF allegato</div>';return;} el.innerHTML=tempDocs.map((d,i)=>`<div class="docRow"><span class="docName">📄 ${escapeHtml(d.name)}</span><span><button type="button" onclick="openDoc(${i})">Apri</button> <button type="button" class="danger" onclick="removeDoc(${i})">Elimina</button></span></div>`).join('');}
function removeDoc(i){tempDocs.splice(i,1);renderDocs();}
function openDoc(i){let d=tempDocs[i];if(!d)return;let w=window.open();w.document.write(`<iframe src="${d.data}" style="border:0;width:100%;height:100vh"></iframe>`);}

window.nuovoMontaggio=nuovoMontaggio; window.apriMontaggio=apriMontaggio; window.chiudiForm=chiudiForm; window.salvaMontaggio=salvaMontaggio; window.eliminaMontaggio=eliminaMontaggio; window.render=render; window.cambiaMese=cambiaMese; window.vaiMese=vaiMese; window.aggiungiPDF=aggiungiPDF; window.openDoc=openDoc; window.removeDoc=removeDoc;
renderDocs(); render();
</script>
</body>
</html>
